<!doctype html>
<html lang="zh-CN" data-theme="light" data-accent="violet">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5fa">
  <title>Hashroom 文件摘要小助手 by lingyicute</title>
  <script>
    try {
      const accents = ['violet', 'blue', 'teal', 'green', 'orange', 'rose'];
      const savedTheme = localStorage.getItem('hashroom-theme');
      const savedAccent = localStorage.getItem('hashroom-accent');
      const colors = {
        violet: ['#f7f5fa', '#141218'],
        blue: ['#f5f7fc', '#10141a'],
        teal: ['#f4f8f7', '#101615'],
        green: ['#f5f8f4', '#111612'],
        orange: ['#faf6f3', '#161310'],
        rose: ['#faf5f7', '#161214']
      };
      const dark = savedTheme === 'dark' || (!savedTheme && matchMedia('(prefers-color-scheme: dark)').matches);
      const accent = accents.includes(savedAccent) ? savedAccent : 'violet';
      if (dark) document.documentElement.dataset.theme = 'dark';
      document.documentElement.dataset.accent = accent;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = colors[accent][dark ? 1 : 0];
    } catch (error) {
      // Storage can be blocked; the default theme still renders.
    }
  </script>
  <style>

      --primary-container: #eaddff;
      --on-primary-container: #25113f;
      --error: #b3261e;
      --error-container: #f9dedc;
      --on-error-container: #410e0b;
      --success: #1b7a3a;
      --success-container: #d8f3e0;

    html[data-accent="violet"] {

    html[data-accent="orange"] {

    html[data-theme="dark"][data-accent="orange"] {

    }

      --primary: #a21c55;

      --on-primary-container: #500724;
      --bg: #faf5f7;
      --surface-low: #f6ecef;
      --swatch: #a21c55;
    }

    html[data-theme="dark"][data-accent="rose"] {
      --primary: #ffb1c8;
      --on-primary: #5e1133;
      --primary-container: #8a234c;
      --on-primary-container: #fce7f3;
      --bg: #161214;
      --surface-low: #22181d;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      transition: background-color 220ms ease, color 220ms ease;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .app-shell {
      min-height: 100vh;
    }

    .topbar {
      width: min(100% - 56px, 1160px);
      height: 82px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      color: var(--text);
      text-decoration: none;
    }

    .brand-mark {
      width: 43px;
      height: 43px;
      display: grid;
      place-items: center;
      border-radius: 16px;
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .brand-mark svg,
    .icon-button svg {
      width: 22px;
      height: 22px;
    }

    .brand-name {
      font-size: 19px;
      font-weight: 680;
      letter-spacing: -0.045em;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .icon-button {
      width: 46px;
      height: 46px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: transparent;
      color: var(--text);
      cursor: pointer;
      transition: background-color 180ms ease, transform 180ms ease;
    }

    .icon-button:hover,
    .icon-button[aria-expanded="true"] {
      background: var(--surface-high);
    }

    .icon-button:focus-visible,
    .text-button:focus-visible,
    .copy-button:focus-visible,
    .primary-button:focus-visible,
    .clear-file:focus-visible,
    .swatch:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 3px;
    }

    .theme-toggle:hover {
      transform: rotate(-8deg);
    }

    .theme-toggle .moon-icon,
    html[data-theme="dark"] .theme-toggle .sun-icon {
      display: none;
    }

    html[data-theme="dark"] .theme-toggle .moon-icon {
      display: block;
    }

    .palette-wrap {
      position: relative;
    }

    .palette-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 30;
      width: 248px;
      padding: 14px;
      border: 1px solid var(--outline-soft);
      border-radius: 20px;
      background: var(--surface);
      box-shadow: var(--shadow);
    }

    .palette-menu p {
      margin: 0 0 12px;
      font-size: 13px;
      font-weight: 650;
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(6, 1fr);
      gap: 8px;
    }

    .swatch {
      width: 28px;
      height: 28px;
      justify-self: center;
      border: 0;
      border-radius: 50%;
      background: var(--swatch);
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgb(33 29 37 / 12%);
    }

    .swatch.is-active {
      box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--text);
    }

    .page {
      width: min(100% - 48px, 860px);
      margin: 42px auto 76px;
    }

    .hero {
      margin-bottom: 29px;
      animation: rise-in 620ms cubic-bezier(.2, .7, .2, 1) both;
    }

    .eyebrow {
      margin: 0 0 9px;
      color: var(--primary);
      font-size: 12px;
      font-weight: 720;
      letter-spacing: .13em;
    }

    h1 {

      font-size: clamp(36px, 5vw, 47px);
      font-weight: 620;
      letter-spacing: -.055em;
      line-height: 1.5;
    }

    .hero-description {
      max-width: 640px;
      margin: 12px 0 0;
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
    }

    .drop-frame {
      position: relative;
    }

    .dropzone {
      width: 100%;
      min-height: 168px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px 34px;
      border: 1.5px dashed var(--outline);
      border-radius: 28px;
      background: var(--surface-low);
      color: var(--text);
      text-align: left;
      cursor: pointer;
      transition: transform 220ms ease, border-color 220ms ease, background-color 220ms ease, box-shadow 220ms ease;
    }

    .dropzone:hover,
    .dropzone.is-dragging {
      border-color: var(--primary);
      background: var(--primary-container);
      box-shadow: var(--shadow);
      transform: translateY(-2px);
    }

    .dropzone:focus-visible {
      outline: 3px solid var(--primary);
      outline-offset: 4px;
    }

    .drop-state,
    .file-state {
      width: min(100%, 580px);
      display: flex;
      align-items: center;
      gap: 17px;
    }

    .drop-state {
      justify-content: center;
    }

    .drop-icon,
    .file-icon {
      width: 58px;
      height: 58px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 20px;
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .drop-icon svg,
    .file-icon svg,
    .empty-icon svg,
    .banner-icon svg {
      width: 24px;
      height: 24px;
    }

    .drop-copy,
    .file-details {
      min-width: 0;
      display: grid;
      gap: 4px;
    }

    .drop-copy strong,
    .file-details strong {
      font-size: 17px;
      font-weight: 610;
      letter-spacing: -.02em;
    }

    .drop-copy>span,
    .file-details>span,
    .section-note,
    .algo-footnote,
    .compare-hint {
      color: var(--muted);
      font-size: 13px;
    }

    .select-hint {
      color: var(--primary);
      font-weight: 650;
      text-decoration: underline;
      text-decoration-color: transparent;
      text-underline-offset: 3px;
    }

    .dropzone:hover .select-hint {
      text-decoration-color: currentColor;
    }

    .file-state {
      padding: 4px 42px 4px 0;
    }

    .file-details {
      flex: 1;
      text-align: left;
    }

    .file-details strong {
      overflow-wrap: anywhere;
    }

    .replace-hint {
      flex: 0 0 auto;
      color: var(--primary);
      font-size: 13px;
      font-weight: 650;
    }

    .clear-file {
      position: absolute;
      top: 13px;
      right: 13px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
    }

    .clear-file:hover {
      background: var(--surface-high);
      color: var(--text);
    }

    .clear-file svg {
      width: 18px;
      height: 18px;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .panel {
      margin-top: 22px;
    }

    .section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    .section-head h2,
    .results-heading h2 {
      margin: 0;
      font-size: 18px;
      font-weight: 650;
      letter-spacing: -.025em;
    }

    .section-title {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
    }

    .inline-actions,
    .results-actions {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    .algo-groups {
      display: grid;
      gap: 14px;
    }

    .algo-group-label {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 680;
      letter-spacing: .06em;
    }

    .algorithm-list {
      display: flex;
      flex-wrap: wrap;
      gap: 9px;
    }

    .algorithm-option {
      min-height: 42px;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 0 14px;
      border: 1px solid var(--outline);
      border-radius: 14px;

      color: var(--text);
      cursor: pointer;
      user-select: none;
      transition: border-color 170ms ease, background-color 170ms ease, transform 170ms ease;
    }

    .algorithm-option:hover {
      border-color: var(--primary);
      transform: translateY(-1px);
    }

    .algorithm-option.is-selected {
      border-color: transparent;
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .algorithm-option.is-disabled {
      opacity: .48;
      cursor: not-allowed;
    }

    .algorithm-option.is-disabled:hover {
      border-color: var(--outline);
      transform: none;
    }

    .algorithm-option:focus-within {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .algorithm-option input {
      width: 17px;
      height: 17px;
      flex: 0 0 auto;
      appearance: none;
      display: grid;
      place-items: center;
      margin: 0;
      border: 1.5px solid var(--outline);
      border-radius: 5px;
      background: var(--surface);
      cursor: pointer;
    }

    .algorithm-option input::after {
      width: 8px;
      height: 5px;
      content: "";
      border-bottom: 1.8px solid var(--on-primary);
      border-left: 1.8px solid var(--on-primary);
      opacity: 0;
      transform: translateY(-1px) rotate(-45deg);
    }

    .algorithm-option input:checked {
      border-color: var(--primary);
      background: var(--primary);
    }

    .algorithm-option input:checked::after {
      opacity: 1;
    }

    .algorithm-name {
      font-size: 13px;
      font-weight: 620;
    }

    .algo-footnote {
      margin: 12px 2px 0;
    }

    .compare-card {
      margin-top: 22px;
      padding: 18px;
      border: 1px solid var(--outline-soft);
      border-radius: 24px;
      background: var(--surface);
    }

    .compare-card .section-head {
      margin-bottom: 12px;
    }

    .expected-input {
      width: 100%;
      min-height: 84px;
      resize: vertical;
      padding: 14px 16px;
      border: 0;
      border-radius: 16px;
      background: var(--surface-low);
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.65;
    }

    .expected-input:focus {
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }

    .expected-input::placeholder {
      color: var(--muted);
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    }

    .compare-tools {
      min-height: 36px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 8px;
    }

    .compare-hint {
      margin: 0;
    }

    .compare-banner {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      margin-top: 12px;
      padding: 13px 14px;
      border-radius: 16px;
    }

    .compare-banner.is-match {
      background: var(--success-container);
      color: var(--on-success-container);
    }

    .compare-banner.is-mismatch,
    .compare-banner.is-invalid {
      background: var(--error-container);
      color: var(--on-error-container);
    }

    .compare-banner.is-info {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .banner-icon {
      width: 28px;
      height: 28px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
    }

    .banner-copy strong,
    .banner-copy span {
      display: block;
    }

    .banner-copy strong {
      font-size: 14px;
      font-weight: 680;
    }

    .banner-copy span {
      margin-top: 2px;
      font-size: 13px;
      line-height: 1.55;
    }

    .action-row {
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-top: 18px;
    }

    .status-line {
      min-height: 22px;
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      overflow-wrap: anywhere;
    }

    .status-line.is-error {
      color: var(--error);
    }

    .status-line.is-match {
      color: var(--success);
    }

    .primary-button,
    .text-button,
    .copy-button {
      border: 0;
      cursor: pointer;
    }

    .primary-button {
      min-width: 158px;
      height: 50px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 0 23px;
      border-radius: 17px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 14px;
      font-weight: 660;
      box-shadow: 0 2px 5px rgb(38 27 57 / 13%);
      transition: box-shadow 180ms ease, transform 180ms ease, opacity 180ms ease;
    }

    .primary-button:hover:not(:disabled) {
      box-shadow: 0 5px 13px rgb(38 27 57 / 19%);
      transform: translateY(-1px);
    }

    .primary-button:disabled,
    .text-button:disabled {
      cursor: not-allowed;
      opacity: .52;
    }

    .primary-button:disabled {
      box-shadow: none;
    }

    .primary-button svg,
    .text-button svg,
    .copy-button svg {
      width: 18px;
      height: 18px;
    }

    .button-spinner {
      width: 17px;
      height: 17px;
      border: 2px solid currentColor;
      border-right-color: transparent;
      border-radius: 50%;
      animation: spin 700ms linear infinite;
    }

    .results-section {
      margin-top: 38px;
      animation: rise-in 720ms 80ms cubic-bezier(.2, .7, .2, 1) both;
    }

    .results-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 13px;
    }

    .text-button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 9px;
      border-radius: 12px;
      background: transparent;
      color: var(--primary);
      font-size: 13px;
      font-weight: 650;
    }

    .text-button:hover:not(:disabled) {
      background: var(--primary-container);
    }

    .text-button:disabled {
      color: var(--muted);
    }

    .results-panel {
      overflow: hidden;
      border: 1px solid var(--outline-soft);
      border-radius: 24px;
      background: var(--surface);
    }

    .empty-result {
      min-height: 132px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 15px;
      padding: 25px;
    }

    .empty-icon {
      width: 44px;
      height: 44px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      border-radius: 15px;
      background: var(--surface-low);
      color: var(--muted);
    }

    .empty-copy p {
      margin: 0;
    }

    .empty-title {
      font-size: 14px;
      font-weight: 610;
    }

    .empty-description {
      margin-top: 3px !important;
      color: var(--muted);
      font-size: 13px;
    }

    .results-panel.is-error .empty-icon {
      background: var(--error-container);
      color: var(--error);
    }

    .loading-track {
      height: 3px;
      overflow: hidden;
      background: var(--surface-high);
    }

    .loading-track span {
      width: 0;
      height: 100%;
      display: block;
      background: var(--primary);
      transition: width 180ms linear;
    }

    .digest-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: center;
      gap: 18px;
      padding: 18px 20px;
      animation: rise-in 380ms cubic-bezier(.2, .7, .2, 1) both;
    }

    .digest-row+.digest-row {
      border-top: 1px solid var(--outline-soft);
    }

    .digest-row.is-match {
      background: color-mix(in srgb, var(--success-container) 72%, var(--surface));
    }

    .digest-row.is-mismatch {
      background: color-mix(in srgb, var(--error-container) 76%, var(--surface));
    }

    .digest-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px 10px;
      margin-bottom: 8px;
    }

    .digest-algorithm {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .02em;
    }

    .digest-length {
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .04em;
    }

    .match-pill {
      min-height: 22px;
      display: inline-flex;
      align-items: center;
      padding: 0 8px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 700;
    }

    .match-pill.is-match {
      background: var(--success-container);
      color: var(--on-success-container);
    }

    .match-pill.is-mismatch {
      background: var(--error-container);
      color: var(--on-error-container);
    }

    .digest-value {
      display: block;
      color: var(--text);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      line-height: 1.75;
      overflow-wrap: anywhere;
      user-select: all;
    }

    .copy-button {
      width: 40px;
      height: 40px;
      display: grid;
      place-items: center;
      border-radius: 13px;
      background: var(--surface-low);
      color: var(--muted);
    }

    .copy-button:hover,
    .copy-button.is-copied {
      background: var(--primary-container);
      color: var(--on-primary-container);
    }

    .privacy-note {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      margin: 21px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }

    .privacy-note svg {
      width: 16px;
      height: 16px;
      flex: 0 0 auto;
      margin-top: 1px;
      color: var(--primary);
    }

    .privacy-note p {
      margin: 0;
    }

    @keyframes rise-in {
      from {
        opacity: 0;
        transform: translateY(9px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @media (max-width: 640px) {

  <script>

    const WEB_CRYPTO = new Set(['SHA-1', 'SHA-256', 'SHA-384', 'SHA-512']);
    const HASH_LENGTHS = new Set(ALGORITHMS.map(item => item.bits / 4));

    const fileInput = document.getElementById('fileInput');
    const dropzone = document.getElementById('dropzone');

    const iconMarkup = {
      hash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M9 4 7.8 20M16.2 4 15 20M4.5 9h15M3.8 15h15"/></svg>',
      copy: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>',
      check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 4 4L19 6"/></svg>',
      error: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg>',

    let algorithmInputs = [];

    const copyTimers = new WeakMap();

    function rotr32(value, bits) {
      return ((value >>> bits) | (value << (32 - bits))) >>> 0;
    }

    function rotl32(value, bits) {
      return ((value << bits) | (value >>> (32 - bits))) >>> 0;
    }

    function readU32BE(bytes, offset) {
      return ((bytes[offset] << 24) | (bytes[offset + 1] << 16) | (bytes[offset + 2] << 8) | bytes[offset + 3]) >>> 0;
    }

    function readU32LE(bytes, offset) {
      return (bytes[offset] | (bytes[offset + 1] << 8) | (bytes[offset + 2] << 16) | (bytes[offset + 3] << 24)) >>> 0;
    }

    function writeU32BE(bytes, offset, value) {
      bytes[offset] = value >>> 24;
      bytes[offset + 1] = value >>> 16;
      bytes[offset + 2] = value >>> 8;
      bytes[offset + 3] = value;
    }

    function writeU32LE(bytes, offset, value) {
      bytes[offset] = value;
      bytes[offset + 1] = value >>> 8;
      bytes[offset + 2] = value >>> 16;
      bytes[offset + 3] = value >>> 24;
    }

    function bytesToHex(bytes) {
      let hex = '';
      for (let i = 0; i < bytes.length; i += 1) hex += bytes[i].toString(16).padStart(2, '0');
      return hex;
    }

    function writeBitLength(buffer, offset, byteCount, lengthBytes, littleEndian) {
      const bitLo = (byteCount << 3) >>> 0;
      const bitHi = Math.floor(byteCount / 0x20000000);
      if (lengthBytes === 8) {
        if (littleEndian) {
          writeU32LE(buffer, offset, bitLo);
          writeU32LE(buffer, offset + 4, bitHi);
        } else {
          writeU32BE(buffer, offset, bitHi);
          writeU32BE(buffer, offset + 4, bitLo);
        }
        return;
      }
      const hi64 = Math.floor(byteCount / 2 ** 61);
      writeU32BE(buffer, offset, 0);
      writeU32BE(buffer, offset + 4, hi64);
      writeU32BE(buffer, offset + 8, bitHi);
      writeU32BE(buffer, offset + 12, bitLo);
    }

    class BufferedHash {
      constructor(blockSize) {
        this.blockSize = blockSize;
        this.buffer = new Uint8Array(blockSize);
        this.bufferLen = 0;
        this.totalLen = 0;
      }

      update(data) {
        this.totalLen += data.length;
        let offset = 0;
        if (this.bufferLen) {
          const take = Math.min(this.blockSize - this.bufferLen, data.length);
          this.buffer.set(data.subarray(0, take), this.bufferLen);
          this.bufferLen += take;
          offset = take;
          if (this.bufferLen === this.blockSize) {
            this.process(this.buffer, 0);
            this.bufferLen = 0;
          }
        }
        while (offset + this.blockSize <= data.length) {
          this.process(data, offset);
          offset += this.blockSize;
        }
        if (offset < data.length) {
          this.buffer.set(data.subarray(offset), 0);
          this.bufferLen = data.length - offset;
        }
        return this;
      }

      finish(lengthBytes, littleEndian) {
        this.buffer[this.bufferLen] = 0x80;
        this.bufferLen += 1;
        if (this.bufferLen > this.blockSize - lengthBytes) {
          this.buffer.fill(0, this.bufferLen);
          this.process(this.buffer, 0);
          this.bufferLen = 0;
        }
        this.buffer.fill(0, this.bufferLen);
        writeBitLength(this.buffer, this.blockSize - lengthBytes, this.totalLen, lengthBytes, littleEndian);
        this.process(this.buffer, 0);
      }
    }

    const MD5_S = [
      7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22, 7, 12, 17, 22,
      5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20, 5, 9, 14, 20,
      4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23, 4, 11, 16, 23,
      6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21, 6, 10, 15, 21
    ];
    const MD5_T = new Uint32Array('d76aa478 e8c7b756 242070db c1bdceee f57c0faf 4787c62a a8304613 fd469501 698098d8 8b44f7af ffff5bb1 895cd7be 6b901122 fd987193 a679438e 49b40821 f61e2562 c040b340 265e5a51 e9b6c7aa d62f105d 02441453 d8a1e681 e7d3fbc8 21e1cde6 c33707d6 f4d50d87 455a14ed a9e3e905 fcefa3f8 676f02d9 8d2a4c8a fffa3942 8771f681 6d9d6122 fde5380c a4beea44 4bdecfa9 f6bb4b60 bebfbc70 289b7ec6 eaa127fa d4ef3085 04881d05 d9d4d039 e6db99e5 1fa27cf8 c4ac5665 f4292244 432aff97 ab9423a7 fc93a039 655b59c3 8f0ccc92 ffeff47d 85845dd1 6fa87e4f fe2ce6e0 a3014314 4e0811a1 f7537e82 bd3af235 2ad7d2bb eb86d391'.split(' ').map(hex => parseInt(hex, 16)));

    class Md5 extends BufferedHash {
      constructor() {
        super(64);
        this.h = new Uint32Array([0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476]);
      }

      process(block, offset) {
        const m = new Uint32Array(16);
        for (let i = 0; i < 16; i += 1) m[i] = readU32LE(block, offset + i * 4);
        let a = this.h[0];
        let b = this.h[1];
        let c = this.h[2];
        let d = this.h[3];
        for (let i = 0; i < 64; i += 1) {
          let f;
          let g;
          if (i < 16) {
            f = (b & c) | (~b & d);

    const RIPEMD_SR = [8, 9, 9, 11, 13, 15, 15, 5, 7, 7, 8, 11, 14, 14, 12, 6, 9, 13, 15, 7, 12, 8, 9, 11, 7, 7, 12, 7, 6, 15, 13, 11, 9, 7, 15, 11, 8, 6, 6, 14, 12, 13, 5, 14, 13, 13, 7, 5, 15, 5, 8, 11, 14, 14, 6, 14, 6, 9, 12, 9, 12, 5, 15, 8, 8, 5, 12, 9, 12, 5, 14, 6, 8, 13, 6, 5, 15, 13, 11, 11];
    const RIPEMD_KL = Uint32Array.of(0x00000000, 0x5a827999, 0x6ed9eba1, 0x8f1bbcdc, 0xa953fd4e);
    const RIPEMD_KR = Uint32Array.of(0x50a28be6, 0x5c4dd124, 0x6d703ef3, 0x7a6d76e9, 0x00000000);
    const RIPEMD_FL = [
      (b, c, d) => (b ^ c ^ d) >>> 0,
      (b, c, d) => ((b & c) | ((~b >>> 0) & d)) >>> 0,
      (b, c, d) => ((b | (~c >>> 0)) ^ d) >>> 0,
      (b, c, d) => ((b & d) | (c & (~d >>> 0))) >>> 0,
      (b, c, d) => (b ^ (c | (~d >>> 0))) >>> 0
    ];
    const RIPEMD_FR = RIPEMD_FL.slice().reverse();

    class Ripemd160 extends BufferedHash {
      constructor() {
        super(64);
        this.h = new Uint32Array([0x67452301, 0xefcdab89, 0x98badcfe, 0x10325476, 0xc3d2e1f0]);
      }

      process(block, offset) {
        const w = new Uint32Array(16);
        for (let i = 0; i < 16; i += 1) w[i] = readU32LE(block, offset + i * 4);
        let al = this.h[0];
        let bl = this.h[1];
        let cl = this.h[2];
        let dl = this.h[3];
        let el = this.h[4];
        let ar = al;
        let br = bl;
        let cr = cl;
        let dr = dl;
        let er = el;
        for (let i = 0; i < 80; i += 1) {
          const round = i >> 4;
          const tl = (al + RIPEMD_FL[round](bl, cl, dl) + w[RIPEMD_IL[i]] + RIPEMD_KL[round]) >>> 0;
          const nal = (rotl32(tl, RIPEMD_SL[i]) + el) >>> 0;
          al = el;
          el = dl;
          dl = rotl32(cl, 10);
          cl = bl;
          bl = nal;
          const tr = (ar + RIPEMD_FR[round](br, cr, dr) + w[RIPEMD_IR[i]] + RIPEMD_KR[round]) >>> 0;
          const nar = (rotl32(tr, RIPEMD_SR[i]) + er) >>> 0;
          ar = er;
          er = dr;
          dr = rotl32(cr, 10);
          cr = br;
          br = nar;
        }
        const t = (this.h[1] + cl + dr) >>> 0;
        this.h[1] = (this.h[2] + dl + er) >>> 0;
        this.h[2] = (this.h[3] + el + ar) >>> 0;
        this.h[3] = (this.h[4] + al + br) >>> 0;
        this.h[4] = (this.h[0] + bl + cr) >>> 0;
        this.h[0] = t;
      }

      digest() {
        this.finish(8, true);
        const out = new Uint8Array(20);
        for (let i = 0; i < 5; i += 1) writeU32LE(out, i * 4, this.h[i]);
        return bytesToHex(out);
      }
    }

    const CRC_TABLE = (() => {
      const table = new Uint32Array(256);
      for (let i = 0; i < 256; i += 1) {
        let c = i;
        for (let bit = 0; bit < 8; bit += 1) c = (c & 1) ? (0xedb88320 ^ (c >>> 1)) : (c >>> 1);
        table[i] = c >>> 0;
      }
      return table;
    })();

    class Crc32 {
      constructor() {
        this.crc = 0xffffffff;
      }

      update(data) {
        let c = this.crc;
        for (let i = 0; i < data.length; i += 1) c = (CRC_TABLE[(c ^ data[i]) & 255] ^ (c >>> 8)) >>> 0;
        this.crc = c;
        return this;
      }

      digest() {
        return ((this.crc ^ 0xffffffff) >>> 0).toString(16).padStart(8, '0');
      }
    }

    function createHasher(id) {
      switch (id) {
        case 'MD5': return new Md5();
        case 'SHA-1': return new Sha1();
        case 'SHA-224': return new Sha256(new Uint32Array([0xc1059ed8, 0x367cd507, 0x3070dd17, 0xf70e5939, 0xffc00b31, 0x68581511, 0x64f98fa7, 0xbefa4fa4]), 28);
        case 'SHA-256': return new Sha256(new Uint32Array([0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19]), 32);
        case 'SHA-384': return new Sha512(['cbbb9d5dc1059ed8', '629a292a367cd507', '9159015a3070dd17', '152fecd8f70e5939', '67332667ffc00b31', '8eb44a8768581511', 'db0c2e0d64f98fa7', '47b5481dbefa4fa4'], 48);
        case 'SHA-512': return new Sha512(['6a09e667f3bcc908', 'bb67ae8584caa73b', '3c6ef372fe94f82b', 'a54ff53a5f1d36f1', '510e527fade682d1', '9b05688c2b3e6c1f', '1f83d9abfb41bd6b', '5be0cd19137e2179'], 64);
        case 'SHA-512/224': return new Sha512(['8c3d37c819544da2', '73e1996689dcd4d6', '1dfab7ae32ff9c82', '679dd514582f9fcf', '0f6d2b697bd44da8', '77e36f7304c48942', '3f9d85a86a1d36c8', '1112e6ad91d692a1'], 28);
        case 'SHA-512/256': return new Sha512(['22312194fc2bf72c', '9f555fa3c84c64c2', '2393b86b6f53b151', '963877195940eabd', '96283ee2a88effe3', 'be5e1e2553863992', '2b0199fc2c85b8aa', '0eb72ddc81c52ca2'], 32);
        case 'SHA3-224': return new Sha3(144, 28);
        case 'SHA3-256': return new Sha3(136, 32);
        case 'SHA3-384': return new Sha3(104, 48);
        case 'SHA3-512': return new Sha3(72, 64);
        case 'RIPEMD-160': return new Ripemd160();
        case 'CRC32': return new Crc32();
        default: throw new Error(`Unknown algorithm: ${id}`);
      }
    }

    function digestBytes(id, bytes) {
      const hasher = createHasher(id);
      const step = 1024 * 1024;
      for (let offset = 0; offset < bytes.length; offset += step) hasher.update(bytes.subarray(offset, offset + step));
      return hasher.digest();
    }

    function hexEqual(left, right) {
      if (left.length !== right.length) return false;
      let diff = 0;
      for (let i = 0; i < left.length; i += 1) diff |= left.charCodeAt(i) ^ right.charCodeAt(i);
      return diff === 0;
    }

    function firstDifference(left, right) {
      const length = Math.min(left.length, right.length);
      for (let i = 0; i < length; i += 1) if (left[i] !== right[i]) return i + 1;
      return length + 1;
    }

    function canonicalAlgorithm(token) {
      const key = token.toLowerCase().replace(/[^a-z0-9]/g, '');
      return {
        md5: 'MD5',
        sha1: 'SHA-1',
        sha224: 'SHA-224',
        sha256: 'SHA-256',
        sha384: 'SHA-384',
        sha512: 'SHA-512',
        sha512224: 'SHA-512/224',
        sha512256: 'SHA-512/256',
        sha3224: 'SHA3-224',
        sha3256: 'SHA3-256',
        sha3384: 'SHA3-384',
        sha3512: 'SHA3-512',
        ripemd160: 'RIPEMD-160',
        rmd160: 'RIPEMD-160',
        crc32: 'CRC32'
      }[key] || null;
    }

    function algorithmsForLength(length) {
      return ALGORITHMS.filter(item => item.bits / 4 === length);
    }

    function extractHex(line, expectedLength) {
      const tokens = (line.replace(/0x(?=[0-9a-fA-F])/gi, '').match(/[0-9a-fA-F]+/g) || []).map(token => token.toLowerCase());
      if (!tokens.length) return '';
      const joined = tokens.join('');
      if (expectedLength && joined.length === expectedLength) return joined;
      if (!expectedLength && HASH_LENGTHS.has(joined.length)) return joined;
      if (expectedLength) {
        const exact = tokens.find(token => token.length === expectedLength);
        if (exact) return exact;
      }
      const known = tokens.filter(token => HASH_LENGTHS.has(token.length)).sort((a, b) => b.length - a.length);
      return known[0] || joined;
    }

    function parseExpected(raw) {
      const lines = raw.split(/\r?\n/).map(line => line.trim()).filter(Boolean);
      if (!lines.length) return {entries: [], invalid: false};
      const entries = [];
      let invalid = false;
      lines.forEach(line => {
        const found = line.match(/sha-?3-?(?:224|256|384|512)|sha-?512[/-]?(?:224|256)|sha-?(?:224|256|384|512|1)|ripemd-?160|rmd-?160|crc-?32|md-?5/i);
        const algorithm = found ? canonicalAlgorithm(found[0]) : null;
        const expectedLength = algorithm ? ALGORITHMS.find(item => item.id === algorithm).bits / 4 : 0;
        const hex = extractHex(line, expectedLength);
        if (!hex || !HASH_LENGTHS.has(hex.length)) {
          invalid = true;
          return;
        }
        entries.push({algorithm, hex, raw: line});
      });
      return {entries, invalid: invalid && !entries.length, partialInvalid: invalid && entries.length > 0};
    }

    function entryTargets(entry, algorithm, hex) {
      if (entry.algorithm) return entry.algorithm === algorithm;
      return entry.hex.length === hex.length;
    }

    function rowComparison(result) {
      const targets = expectedEntries.filter(entry => entryTargets(entry, result.algorithm, result.hex));
      if (!targets.length) return null;
      const matched = targets.some(entry => hexEqual(entry.hex, result.hex));
      return matched ? 'match' : 'mismatch';
    }

    function candidateAlgorithms() {
      const ids = new Set();
      expectedEntries.forEach(entry => {
        if (entry.algorithm) ids.add(entry.algorithm);
        else algorithmsForLength(entry.hex.length).forEach(item => ids.add(item.id));
      });
      return [...ids];
    }

    function missingCandidates() {
      const selected = new Set(selectedAlgorithms());
      const disabled = new Set(algorithmInputs.filter(input => input.disabled).map(input => input.value));
      return candidateAlgorithms().filter(id => !selected.has(id) && !disabled.has(id));
    }

    function describeCandidates(ids) {
      return ids.join('、');
    }

    function renderBanner(kind, title, detail) {
      compareBanner.hidden = false;
      compareBanner.className = `compare-banner is-${kind}`;
      compareBanner.replaceChildren();
      const icon = document.createElement('span');
      icon.className = 'banner-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.innerHTML = kind === 'match' ? iconMarkup.check : kind === 'info' ? iconMarkup.hash : iconMarkup.error;
      const copy = document.createElement('div');
      copy.className = 'banner-copy';
      const heading = document.createElement('strong');
      heading.textContent = title;
      const text = document.createElement('span');
      text.textContent = detail;
      copy.append(heading, text);
      compareBanner.append(icon, copy);
    }

    function updateComparison() {
      const parsed = parseExpected(expectedInput.value);
      expectedEntries = parsed.entries;
      expectedInvalid = parsed.invalid;
      const missing = missingCandidates();
      applySuggested.hidden = !expectedEntries.length || !missing.length;
      applySuggested.textContent = selectedAlgorithms().length ? '补选可能的算法' : '选择这些算法';

      if (!expectedInput.value.trim()) {
        compareBanner.hidden = true;
        compareHint.textContent = '计算完成后会自动比对，忽略大小写和分隔符。';
        return;
      }
      if (parsed.invalid) {
        compareHint.textContent = '未识别到有效哈希。';
        renderBanner('invalid', '无法识别预期值', '请粘贴十六进制哈希，可以带算法名称、空格或冒号。');
        return;
      }

      const named = [...new Set(expectedEntries.map(entry => entry.algorithm).filter(Boolean))];
      const unnamed = expectedEntries.filter(entry => !entry.algorithm);
      const lengthNames = [...new Set(unnamed.flatMap(entry => algorithmsForLength(entry.hex.length).map(item => item.id)))];
      let hint = named.length ? `已识别 ${named.join('、')}` : `已识别 ${expectedEntries[0].hex.length} 位十六进制`;
      if (!named.length && lengthNames.length) hint += `，可能是 ${lengthNames.join('、')}`;
      if (parsed.partialInvalid) hint += '。有一行无法识别，已忽略';
      compareHint.textContent = `${hint}。`;

      if (!currentResults.length) {
        renderBanner('info', '等待计算结果', missing.length ? `还需要计算 ${describeCandidates(missing)}。` : '点击计算后会自动比对。');
        return;
      }

      const matched = [];
      const mismatched = [];
      const pending = [];
      expectedEntries.forEach(entry => {
        const targets = currentResults.filter(result => entryTargets(entry, result.algorithm, result.hex));
        if (!targets.length) {
          pending.push(entry.algorithm || `${entry.hex.length} 位哈希`);
          return;
        }
        const hit = targets.find(result => hexEqual(result.hex, entry.hex));
        if (hit) matched.push(hit.algorithm);
        else mismatched.push(entry.algorithm || targets.map(result => result.algorithm).join(' / '));
      });

      if (mismatched.length) {
        const first = expectedEntries.find(entry => {
          const targets = currentResults.filter(result => entryTargets(entry, result.algorithm, result.hex));
          return targets.length && !targets.some(result => hexEqual(result.hex, entry.hex));
        });
        const target = first && currentResults.find(result => entryTargets(first, result.algorithm, result.hex) && result.hex.length === first.hex.length);
        const where = target ? `，与 ${target.algorithm} 从第 ${firstDifference(first.hex, target.hex)} 位开始不同` : '';
        renderBanner('mismatch', '校验值不一致', `${mismatched.join('、')} 没有匹配${where}。`);
        return;
      }
      if (pending.length && !matched.length) {
        renderBanner('info', '还没有可比对的结果', `请计算 ${describeCandidates(missing)}。`);
        return;
      }
      if (pending.length) {
        renderBanner('info', `已匹配 ${matched.join('、')}`, `仍有预期值尚未计算：${pending.join('、')}。`);
        return;
      }
      renderBanner('match', `与 ${matched.join('、')} 一致`, '预期值与本次计算结果完全相同。');
    }

    function selectedAlgorithms() {
      return algorithmInputs.filter(input => input.checked).map(input => input.value);
    }

    function refreshAlgorithmStyles() {
      algorithmInputs.forEach(input => input.closest('.algorithm-option').classList.toggle('is-selected', input.checked));
      const count = selectedAlgorithms().length;
      algorithmCount.textContent = count ? `已选 ${count} 种` : '未选择';
    }

    function setStatus(message, kind = '') {
      statusLine.textContent = message;
      statusLine.className = `status-line${kind ? ` is-${kind}` : ''}`;
    }

    function formatBytes(bytes) {
      if (bytes === 0) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB', 'TB'];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      const value = bytes / (1024 ** index);
      return `${value.toFixed(index === 0 || value >= 10 ? 0 : 1)} ${units[index]}`;
    }

    function describeFile(file) {
      const parts = file.name.split('.');
      const extensionName = parts.length > 1 ? parts[parts.length - 1] : '';
      const extension = extensionName ? extensionName.toUpperCase() : (file.type ? file.type.split('/').pop().toUpperCase() : '文件');
      const modified = file.lastModified ? new Date(file.lastModified).toLocaleDateString('zh-CN', {year: 'numeric', month: '2-digit', day: '2-digit'}) : '';
      return [extension, formatBytes(file.size), modified].filter(Boolean).join(' · ');
    }

    function hasExpectedValue() {
      return expectedEntries.length > 0;
    }

    function updateComputeButton() {
      computeButton.disabled = !selectedFile || !selectedAlgorithms().length || isCalculating;
      computeButton.setAttribute('aria-busy', String(isCalculating));
      computeLabel.textContent = isCalculating ? '正在计算' : (hasExpectedValue() ? '计算并比对' : '计算哈希');
      computeIcon.hidden = isCalculating;
      buttonSpinner.hidden = !isCalculating;
    }

    function renderMessage(title, description, kind = 'empty', progress = 0) {
      resultsPanel.className = `results-panel${kind === 'error' ? ' is-error' : ''}`;
      resultsPanel.replaceChildren();
      if (kind === 'loading') {
        const track = document.createElement('div');
        track.className = 'loading-track';
        track.setAttribute('aria-hidden', 'true');
        const bar = document.createElement('span');
        bar.style.width = `${Math.max(4, Math.round(progress * 100))}%`;
        track.append(bar);
        resultsPanel.append(track);
      }
      const state = document.createElement('div');
      state.className = 'empty-result';
      const icon = document.createElement('span');
      icon.className = 'empty-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.innerHTML = kind === 'error' ? iconMarkup.error : kind === 'loading' ? iconMarkup.clock : iconMarkup.hash;
      const copy = document.createElement('div');
      copy.className = 'empty-copy';
      const heading = document.createElement('p');
      heading.className = 'empty-title';
      heading.textContent = title;
      const detail = document.createElement('p');
      detail.className = 'empty-description';
      detail.textContent = description;
      copy.append(heading, detail);
      state.append(icon, copy);
      resultsPanel.append(state);
      resultsPanel.setAttribute('aria-busy', String(kind === 'loading'));
    }

    function createDigestRow(result, index) {
      const comparison = rowComparison(result);
      const row = document.createElement('article');
      row.className = `digest-row${comparison ? ` is-${comparison}` : ''}`;
      row.style.animationDelay = `${index * 40}ms`;
      const content = document.createElement('div');
      const meta = document.createElement('div');
      meta.className = 'digest-meta';
      const algorithm = document.createElement('span');
      algorithm.className = 'digest-algorithm';
      algorithm.textContent = result.algorithm;
      const length = document.createElement('span');
      length.className = 'digest-length';
      length.textContent = `${result.hex.length} 个十六进制字符`;
      meta.append(algorithm, length);
      if (comparison) {
        const pill = document.createElement('span');
        pill.className = `match-pill is-${comparison}`;
        pill.textContent = comparison === 'match' ? '一致' : '不一致';
        meta.append(pill);
      }
      const value = document.createElement('code');
      value.className = 'digest-value';
      value.textContent = result.hex;
      content.append(meta, value);
      const button = document.createElement('button');
      button.className = 'copy-button';
      button.type = 'button';
      button.setAttribute('aria-label', `复制 ${result.algorithm} 摘要`);
      const icon = document.createElement('span');
      icon.className = 'copy-icon';
      icon.setAttribute('aria-hidden', 'true');
      icon.innerHTML = iconMarkup.copy;
      button.append(icon);
      button.addEventListener('click', () => copyText(`${result.algorithm}: ${result.hex}`, button, `已复制 ${result.algorithm}`));
      row.append(content, button);
      return row;
    }

    function renderResults(results) {
      currentResults = results;
      copyAllButton.disabled = !results.length;
      resultsPanel.className = 'results-panel';
      resultsPanel.replaceChildren(...results.map(createDigestRow));
      resultsPanel.setAttribute('aria-busy', 'false');
    }

    function clearResults() {
      currentResults = [];
      copyAllButton.disabled = true;
    }

    function onAlgorithmsChanged() {
      runToken += 1;
      isCalculating = false;
      refreshAlgorithmStyles();
      clearResults();
      updateComputeButton();
      updateComparison();
      if (!selectedFile) {
        setStatus(selectedAlgorithms().length ? '尚未选择文件' : '请至少选择一种算法。', selectedAlgorithms().length ? '' : 'error');
        renderMessage('还没有摘要', '选好文件并计算后，结果会显示在这里。');
        return;
      }
      const ready = selectedAlgorithms().length > 0;
      setStatus(ready ? '算法已更新，请重新计算。' : '请至少选择一种算法。', ready ? '' : 'error');
      renderMessage('算法已更新', ready ? '再次计算以生成所选算法的摘要。' : '至少选择一种算法后才能计算。');
    }

    function setCheckedAlgorithms(ids, exclusive) {
      const wanted = new Set(ids);
      algorithmInputs.forEach(input => {
        if (input.disabled) return;
        input.checked = exclusive ? wanted.has(input.value) : input.checked || wanted.has(input.value);
      });
      onAlgorithmsChanged();
    }

    function setSelectedFile(file) {
      runToken += 1;
      isCalculating = false;
      selectedFile = file || null;
      fileInput.value = '';
      clearResults();
      updateComputeButton();
      updateComparison();
      if (!selectedFile) {
        emptyFileState.hidden = false;
        selectedFileState.hidden = true;
        clearFileButton.hidden = true;
        fileName.textContent = '';
        fileMeta.textContent = '';
        setStatus('尚未选择文件');
        renderMessage('还没有摘要', '选好文件并计算后，结果会显示在这里。');
        return;
      }
      emptyFileState.hidden = true;
      selectedFileState.hidden = false;
      clearFileButton.hidden = false;
      fileName.textContent = selectedFile.name;
      fileMeta.textContent = describeFile(selectedFile);
      setStatus(selectedAlgorithms().length ? '文件已就绪，可以开始计算。' : '请至少选择一种算法。', selectedAlgorithms().length ? '' : 'error');
      renderMessage('文件已就绪', hasExpectedValue() ? '计算后会立即与预期值比对。' : '点击计算后，所选摘要会显示在这里。');
    }

    function fallbackCopy(text) {
      const textarea = document.createElement('textarea');
      textarea.value = text;
      textarea.setAttribute('readonly', '');
      textarea.style.position = 'fixed';
      textarea.style.opacity = '0';
      document.body.append(textarea);
      textarea.select();
      const copied = document.execCommand('copy');
      textarea.remove();
      if (!copied) throw new Error('Clipboard copy failed');
    }

    async function copyText(text, button, message) {
      try {
        if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(text);
        else fallbackCopy(text);
        const icon = button.querySelector('.copy-icon');
        if (icon) icon.innerHTML = iconMarkup.check;
        button.classList.add('is-copied');
        setStatus(message, 'match');
        const previous = copyTimers.get(button);
        if (previous) clearTimeout(previous);
        copyTimers.set(button, setTimeout(() => {
          if (!button.isConnected) return;
          const currentIcon = button.querySelector('.copy-icon');
          if (currentIcon) currentIcon.innerHTML = iconMarkup.copy;
          button.classList.remove('is-copied');
        }, 1600));
      } catch (error) {
        setStatus('复制失败，请检查浏览器的剪贴板权限。', 'error');
      }
    }

    function yieldUi() {
      return new Promise(resolve => setTimeout(resolve, 0));
    }

    async function hashFile(file, ids, token, onProgress) {
      const canUseSubtle = ids.every(id => WEB_CRYPTO.has(id)) && window.crypto && crypto.subtle;
      if (canUseSubtle) {
        const buffer = await file.arrayBuffer();
        if (token !== runToken) return null;
        const results = [];
        for (let i = 0; i < ids.length; i += 1) {
          let hex;
          try {
            hex = bytesToHex(new Uint8Array(await crypto.subtle.digest(ids[i], buffer)));
          } catch (error) {
            hex = digestBytes(ids[i], new Uint8Array(buffer));
          }
          results.push({algorithm: ids[i], hex});
          onProgress((i + 1) / ids.length, ids[i]);
          if (token !== runToken) return null;
        }
        return results;
      }

      const hashers = ids.map(id => ({id, hasher: createHasher(id)}));
      const sliceSize = 512 * 1024;
      for (let offset = 0; offset < file.size; offset += sliceSize) {
        if (token !== runToken) return null;
        const bytes = new Uint8Array(await file.slice(offset, offset + sliceSize).arrayBuffer());
        hashers.forEach(item => item.hasher.update(bytes));
        onProgress(Math.min(1, (offset + bytes.length) / Math.max(file.size, 1)));
        await yieldUi();
      }
      if (token !== runToken) return null;
      return hashers.map(item => ({algorithm: item.id, hex: item.hasher.digest()}));
    }

    async function computeHashes() {
      if (!selectedFile || isCalculating) return;
      const ids = selectedAlgorithms();
      if (!ids.length) {
        setStatus('请至少选择一种算法。', 'error');
        return;
      }
      const file = selectedFile;
      const token = ++runToken;
      clearResults();
      isCalculating = true;
      updateComputeButton();
      setStatus('正在读取文件并计算摘要…');
      renderMessage('正在计算摘要', '大文件可能需要一点时间，请保持页面打开。', 'loading', 0.04);
      try {
        const results = await hashFile(file, ids, token, (progress, name) => {
          if (token !== runToken) return;
          const percent = Math.round(progress * 100);
          setStatus(name ? `正在计算 ${name} · ${percent}%` : `正在读取并计算 · ${percent}%`);
          renderMessage('正在计算摘要', name ? `当前算法 ${name}` : '文件正在分块处理。', 'loading', progress);
        });
        if (!results || token !== runToken) return;
        renderResults(results);
        updateComparison();
        const verdict = compareBanner.querySelector('strong');
        if (hasExpectedValue() && verdict) setStatus(verdict.textContent, compareBanner.classList.contains('is-match') ? 'match' : compareBanner.classList.contains('is-mismatch') ? 'error' : '');
        else setStatus(`已完成 ${results.length} 种摘要计算。`, 'match');
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
          resultsSection.scrollIntoView({behavior: 'smooth', block: 'nearest'});
        }
      } catch (error) {
        if (token !== runToken) return;
        renderMessage('无法计算摘要', '文件读取失败或浏览器无法处理该文件，请重新选择后再试。', 'error');
        setStatus('计算未完成，请重试。', 'error');
      } finally {
        if (token === runToken) {
          isCalculating = false;
          updateComputeButton();
        }
      }
    }

    function renderAlgorithms() {
      algorithmMount.replaceChildren();
      ALGORITHM_GROUPS.forEach(group => {
        const wrap = document.createElement('div');
        const label = document.createElement('p');
        label.className = 'algo-group-label';
        label.textContent = group.label;
        const list = document.createElement('div');
        list.className = 'algorithm-list';
        ALGORITHMS.filter(item => item.group === group.id).forEach(item => {
          const option = document.createElement('label');
          option.className = `algorithm-option${item.checked ? ' is-selected' : ''}`;
          if (item.title) option.title = item.title;
          const input = document.createElement('input');
          input.type = 'checkbox';
          input.name = 'algorithm';
          input.value = item.id;
          input.checked = Boolean(item.checked);
          const name = document.createElement('span');
          name.className = 'algorithm-name';
          name.textContent = item.id;
          option.append(input, name);
          list.append(option);
        });
        wrap.append(label, list);
        algorithmMount.append(wrap);
      });
      algorithmInputs = [...document.querySelectorAll('input[name="algorithm"]')];
      algorithmInputs.forEach(input => input.addEventListener('change', onAlgorithmsChanged));
      refreshAlgorithmStyles();
    }

    function renderSwatches() {
      swatchList.replaceChildren();
      ACCENTS.forEach(accent => {
        const button = document.createElement('button');
        button.className = 'swatch';
        button.type = 'button';
        button.dataset.accent = accent.id;
        button.style.setProperty('--swatch', accent.swatch);
        button.setAttribute('role', 'radio');
        button.setAttribute('aria-label', accent.label);
        button.title = accent.label;
        button.addEventListener('click', () => setAccent(accent.id));
        swatchList.append(button);
      });
      updateSwatches();
    }

    function updateSwatches() {
      const current = document.documentElement.dataset.accent || 'violet';
      [...swatchList.children].forEach(button => {
        const active = button.dataset.accent === current;
        button.classList.toggle('is-active', active);
        button.setAttribute('aria-checked', String(active));
      });
    }

    const BACKGROUND_COLORS = {
      violet: ['#f7f5fa', '#141218'],
      blue: ['#f5f7fc', '#10141a'],
      teal: ['#f4f8f7', '#101615'],
      green: ['#f5f8f4', '#111612'],
      orange: ['#faf6f3', '#161310'],
      rose: ['#faf5f7', '#161214']
    };

    function updateThemeColor() {
      const accent = document.documentElement.dataset.accent || 'violet';
      const dark = document.documentElement.dataset.theme === 'dark';
      const colors = BACKGROUND_COLORS[accent] || BACKGROUND_COLORS.violet;
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.content = colors[dark ? 1 : 0];
    }

    function setAccent(accent) {
      document.documentElement.dataset.accent = accent;
      updateSwatches();
      updateThemeColor();
      closePalette();
      try {localStorage.setItem('hashroom-accent', accent);} catch (error) { }
    }

    function setTheme(theme, persist = true) {
      document.documentElement.dataset.theme = theme;
      const dark = theme === 'dark';
      themeToggle.setAttribute('aria-label', dark ? '切换浅色模式' : '切换深色模式');
      themeToggle.title = dark ? '切换浅色模式' : '切换深色模式';
      updateThemeColor();
      if (!persist) return;
      try {localStorage.setItem('hashroom-theme', theme);} catch (error) { }
    }

    function closePalette() {
      paletteMenu.hidden = true;
      paletteToggle.setAttribute('aria-expanded', 'false');
    }

    function disableAlgorithms(ids) {
      algorithmInputs.forEach(input => {
        if (!ids.includes(input.value)) return;
        const option = input.closest('.algorithm-option');
        input.checked = false;
        input.disabled = true;
        option.classList.add('is-disabled');
        option.title = '自检未通过，已暂停使用';
      });
      refreshAlgorithmStyles();
      updateComputeButton();
      const names = ids.join('、');
      setStatus(`算法自检未通过：${names}，已暂停使用。`, 'error');
      renderMessage('算法自检未通过', `${names} 的计算结果与标准测试向量不一致，已暂停这些算法，其他算法不受影响。`, 'error');
    }

    function selfTest() {
      const MSG56 = 'abcdbcdecdefdefgefghfghighijhijkijkljklmklmnlmnomnopnopq';
      const MSG112 = 'abcdefghbcdefghicdefghijdefghijkefghijklfghijklmghijklmnhijklmnoijklmnopjklmnopqklmnopqrlmnopqrsmnopqrstnopqrstu';
      const vectors = [
        ['MD5', '', 'd41d8cd98f00b204e9800998ecf8427e'],
        ['MD5', 'abc', '900150983cd24fb0d6963f7d28e17f72'],
        ['SHA-1', '', 'da39a3ee5e6b4b0d3255bfef95601890afd80709'],
        ['SHA-1', 'abc', 'a9993e364706816aba3e25717850c26c9cd0d89d'],
        ['SHA-224', 'abc', '23097d223405d8228642a477bda255b32aadbce4bda0b3f7e36c9da7'],
        ['SHA-256', '', 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'],
        ['SHA-256', 'abc', 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad'],
        ['SHA-384', 'abc', 'cb00753f45a35e8bb5a03d699ac65007272c32ab0eded1631a8b605a43ff5bed8086072ba1e7cc2358baeca134c825a7'],
        ['SHA-512', 'abc', 'ddaf35a193617abacc417349ae20413112e6fa4e89a97ea20a9eeee64b55d39a2192992a274fc1a836ba3c23a3feebbd454d4423643ce80e2a9ac94fa54ca49f'],
        ['SHA-512/224', 'abc', '4634270f707b6a54daae7530460842e20e37ed265ceee9a43e8924aa'],
        ['SHA-512/256', 'abc', '53048e2681941ef99b2e29b76b4c7dabe4c2d0c634fc6d46e0e2f13107e7af23'],
        ['SHA3-224', '', '6b4e03423667dbb73b6e15454f0eb1abd4597f9a1b078e3f5b5a6bc7'],
        ['SHA3-256', '', 'a7ffc6f8bf1ed76651c14756a061d662f580ff4de43b49fa82d80a4b80f8434a'],
        ['SHA3-256', 'abc', '3a985da74fe225b2045c172d6bd390bd855f086e3e9d525b46bfe24511431532'],
        ['SHA3-384', '', '0c63a75b845e4f7d01107d852e4c2485c51a50aaaa94fc61995e71bbee983a2ac3713831264adb47fb6bd1e058d5f004'],
        ['SHA3-512', '', 'a69f73cca23a9ac5c8b567dc185a756e97c982164fe25859e0d1dcc1475c80a615b2123af1f5f94c11e3e9402c3ac558f500199d95b6d3e301758586281dcd26'],
        ['RIPEMD-160', '', '9c1185a5c5e9fc54612808977ee8f548b2258d31'],
        ['RIPEMD-160', 'abc', '8eb208f7e05d987a9b044a8e98c6b087f15a0bfc'],
        ['CRC32', '', '00000000'],
        ['CRC32', '123456789', 'cbf43926'],
        ['MD5', MSG56, '8215ef0796a20bcaaae116d3876c664a'],
        ['SHA-1', MSG56, '84983e441c3bd26ebaae4aa1f95129e5e54670f1'],
        ['SHA-224', MSG56, '75388b16512776cc5dba5da1fd890150b0c6455cb4f58b1952522525'],
        ['SHA-256', MSG56, '248d6a61d20638b8e5c026930c3e6039a33ce45964ff2167f6ecedd419db06c1'],
        ['SHA-384', MSG56, '3391fdddfc8dc7393707a65b1b4709397cf8b1d162af05abfe8f450de5f36bc6b0455a8520bc4e6f5fe95b1fe3c8452b'],
        ['SHA-512', MSG56, '204a8fc6dda82f0a0ced7beb8e08a41657c16ef468b228a8279be331a703c33596fd15c13b1b07f9aa1d3bea57789ca031ad85c7a71dd70354ec631238ca3445'],
        ['SHA3-224', MSG56, '8a24108b154ada21c9fd5574494479ba5c7e7ab76ef264ead0fcce33'],
        ['SHA3-256', MSG56, '41c0dba2a9d6240849100376a8235e2c82e1b9998a999e21db32dd97496d3376'],
        ['SHA3-384', MSG56, '991c665755eb3a4b6bbdfb75c78a492e8c56a22c5c4d7e429bfdbc32b9d4ad5aa04a1f076e62fea19eef51acd0657c22'],
        ['SHA3-512', MSG56, '04a371e84ecfb5b8b77cb48610fca8182dd457ce6f326a0fd3d7ec2f1e91636dee691fbe0c985302ba1b0d8dc78c086346b533b49c030d99a27daf1139d6e75e'],
        ['RIPEMD-160', MSG56, '12a053384a9c0c88e405a06c27dcf49ada62eb2b'],
        ['SHA-1', MSG112, 'a49b2446a02c645bf419f995b67091253a04a259'],
        ['SHA-224', MSG112, 'c97ca9a559850ce97a04a96def6d99a9e0e0e2ab14e6b8df265fc0b3'],
        ['SHA-256', MSG112, 'cf5b16a778af8380036ce59e7b0492370b249b11e8f07a51afac45037afee9d1'],
        ['SHA-384', MSG112, '09330c33f71147e83d192fc782cd1b4753111b173b3b05d22fa08086e3b0f712fcc7c71a557e2db966c3e9fa91746039'],
        ['SHA-512', MSG112, '8e959b75dae313da8cf4f72814fc143f8f7779c6eb9f7fa17299aeadb6889018501d289e4900f7e4331b99dec4b5433ac7d329eeb6dd26545e96e55b874be909'],
        ['SHA3-224', MSG112, '543e6868e1666c1a643630df77367ae5a62a85070a51c14cbf665cbc'],
        ['SHA3-256', MSG112, '916f6061fe879741ca6469b43971dfdb28b1a32dc36cb3254e812be27aad1d18'],
        ['SHA3-384', MSG112, '79407d3b5916b59c3e30b09822974791c313fb9ecc849e406f23592d04f625dc8c709b98b43b3852b337216179aa7fc7'],
        ['SHA3-512', MSG112, 'afebb2ef542e6579c50cad06d2e578f9f8dd6881d7dc824d26360feebf18a4fa73e3261122948efcfd492e74e82e2189ed0fb440d187f382270cb455f21dd185']
      ];
      const failed = new Set();
      vectors.forEach(([id, text, expected]) => {
        const actual = digestBytes(id, new TextEncoder().encode(text));
        if (actual !== expected) failed.add(id);
      });
      const sample = new TextEncoder().encode(MSG112 + MSG56);
      ALGORITHMS.forEach(item => {
        const whole = digestBytes(item.id, sample);
        const hasher = createHasher(item.id);
        for (let offset = 0; offset < sample.length; offset += 7) hasher.update(sample.subarray(offset, offset + 7));
        if (hasher.digest() !== whole) failed.add(item.id);
      });
      if (failed.size) disableAlgorithms([...failed]);
      else setStatus('算法自检通过', 'match');
    }

    renderAlgorithms();
    renderSwatches();
    renderMessage('还没有摘要', '选好文件并计算后，结果会显示在这里。');
    setTheme(document.documentElement.dataset.theme || 'light', false);

    dropzone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', event => {
      if (event.target.files && event.target.files.length) setSelectedFile(event.target.files[0]);
    });
    ['dragenter', 'dragover'].forEach(type => dropzone.addEventListener(type, event => {
      event.preventDefault();
      dropzone.classList.add('is-dragging');
    }));
    dropzone.addEventListener('dragleave', event => {
      if (!dropzone.contains(event.relatedTarget)) dropzone.classList.remove('is-dragging');
    });
    dropzone.addEventListener('drop', event => {
      event.preventDefault();
      dropzone.classList.remove('is-dragging');
      if (event.dataTransfer && event.dataTransfer.files.length) setSelectedFile(event.dataTransfer.files[0]);
    });
    clearFileButton.addEventListener('click', () => setSelectedFile(null));
    computeButton.addEventListener('click', computeHashes);
    document.getElementById('selectCommon').addEventListener('click', () => {
      setCheckedAlgorithms(ALGORITHMS.filter(item => item.group === 'common').map(item => item.id), true);
    });
    document.getElementById('selectAll').addEventListener('click', () => setCheckedAlgorithms(ALGORITHMS.map(item => item.id), true));
    expectedInput.addEventListener('input', () => {
      updateComparison();
      updateComputeButton();
      if (currentResults.length) renderResults(currentResults);
    });
    clearExpected.addEventListener('click', () => {
      expectedInput.value = '';
      updateComparison();
      updateComputeButton();
      if (currentResults.length) renderResults(currentResults);
      expectedInput.focus();
    });
    applySuggested.addEventListener('click', () => setCheckedAlgorithms(candidateAlgorithms(), false));
    copyAllButton.addEventListener('click', () => {
      if (!currentResults.length) return;
      copyText(currentResults.map(result => `${result.algorithm}: ${result.hex}`).join('\n'), copyAllButton, '已复制全部摘要');
    });
    paletteToggle.addEventListener('click', () => {
      const open = paletteMenu.hidden;
      paletteMenu.hidden = !open;
      paletteToggle.setAttribute('aria-expanded', String(open));
    });
    document.addEventListener('click', event => {
      if (!paletteMenu.hidden && !paletteToggle.contains(event.target) && !paletteMenu.contains(event.target)) closePalette();
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') closePalette();
    });
    themeToggle.addEventListener('click', () => {
      setTheme(document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark');
    });
    selfTest();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
